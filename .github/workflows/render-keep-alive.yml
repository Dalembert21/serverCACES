name: Render Keep Alive Job

on:
  schedule:
    # Ejecuta cada 10 minutos para evitar que el contenedor de Render se suspenda por inactividad (límite de 15 min)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions de GitHub

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping al endpoint de salud en Render
        run: |
          echo "Enviando ping de actividad a https://apiaturitmo.dalpasoft.tech/api/v1/health..."
          HTTP_RESPONSE=$(curl -s -o response.json -w "%{http_code}" --max-time 30 https://apiaturitmo.dalpasoft.tech/api/v1/health)
          echo "Código HTTP recibido: $HTTP_RESPONSE"
          cat response.json || true
          if [ "$HTTP_RESPONSE" -ne 200 ]; then
            echo "Aviso: El backend respondió con código $HTTP_RESPONSE o estaba despertando."
          else
            echo "Instancia activa y saludable con éxito."
          fi
